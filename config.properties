# Yerel Ajan yapılandırması
# Hizli model (varsayilan) - gunluk sorular
model=gemma4:e4b
# Zor akil yururtme gerektiren sorularda devreye giren model
model.reasoning=gemma4:12b
# Bu uzunlugu asan sorular "zor" sayilir
route.complexity_chars=90
server.port=8080

# hızlı streaming mod (önerilen)
fast=true
# derin mod: planner + reflection + uzmanlar (yavaş)
deep=false
# self-consistency: 3 örnek sorup en tutarlı cevabı seçer (yavaş ama daha isabetli)
consensus=false
# özerk hedef üretimi
autonomy=false
# dünya modeli bağlamı
graph=true
# DIDL - kendi modellerimizden olusan karar katmani
brain=true
# Model-as-Tool: autonomous = kendi beynimiz karar verir, LLM sadece arac
# assisted = LLM ana cevap, model = tamamen model
core.mode=autonomous
core.threshold=0.55
# Yedek beyin zinciri: ana model duserse bunlar denenir, hepsi duserse DIDL devreye girer
fallback.models=gemma4:12b,deepseek-r1:7b,gemma4:e4b,qwen2.5:7b-instruct,llama3.1:latest
